<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Radha Radha — Track your daily Naam Jap, monitor your sadhana progress, and achieve your spiritual milestones." />
    <meta name="theme-color" content="#4338ca" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Tiro+Devanagari+Hindi:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Tiro+Devanagari+Hindi:wght@400;700&display=swap"
      />
    </noscript>
    <title>Radha Radha — Naam Jap Tracker</title>
  </head>
  <body class="min-h-screen bg-background font-sans antialiased">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:radial-gradient(ellipse at 50% 20%,rgba(67,56,202,0.12) 0%,#faf8f5 70%);font-family:Inter,system-ui,-apple-system,sans-serif;color:#1e1b4b;padding-top:120px;text-align:center;box-sizing:border-box;">
        <div style="display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(212,168,67,0.4);background:rgba(212,168,67,0.1);padding:6px 18px;border-radius:9999px;font-size:13px;font-weight:600;color:#b45309;margin-bottom:28px;">
          <span>श्री राधा कृपा कटाक्ष • Personal Naam Jap Tracker</span>
        </div>
        <h1 style="font-size:clamp(52px,12vw,84px);font-weight:800;letter-spacing:-0.02em;margin:0 0 16px;color:#0f172a;font-family:'Tiro Devanagari Hindi','Noto Sans Devanagari','Mangal',serif;">
          राधे राधे
        </h1>
        <p style="font-size:clamp(19px,4vw,28px);color:#4338ca;font-weight:600;margin:0 0 14px;font-family:Georgia,serif;">
          Har Naam, Ek Kadam Apne Lakshya Ki Or
        </p>
        <p style="max-width:560px;font-size:15px;color:#64748b;line-height:1.6;margin:0 16px 36px;">
          Apna naam jap track karein aur apni sadhana ki progress dekhein.
        </p>
        <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:48px;">
          <div style="background:#4338ca;color:#fff;font-weight:600;padding:12px 28px;border-radius:12px;font-size:15px;box-shadow:0 10px 15px -3px rgba(67,56,202,0.25);">Start Your Sadhana</div>
          <div style="border:1px solid rgba(67,56,202,0.3);color:#4338ca;font-weight:600;padding:12px 28px;border-radius:12px;font-size:15px;">Sign In</div>
        </div>
      </div>
    </div>
    <div id="yt-bg-devotional-player" style="position:absolute;width:1px;height:1px;overflow:hidden;top:-9999px;left:-9999px;"></div>
<script type="module" src="/src/main.tsx"></script>
    <div id="yt-bg-devotional-player" style="position:absolute;width:1px;height:1px;overflow:hidden;top:-9999px;left:-9999px;"></div>
</body>
</html>
